<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า | AURA JEWELRY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-title">AURA JEWELRY</a>
      <nav class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
      </nav>
    </div>
  </header>

  <main class="section-padding">
    <div class="container" style="max-width: 600px;">
      <h1 class="section-title">แบบฟอร์มสั่งซื้อสินค้า</h1>
      
      <!-- แสดงชื่อสินค้าและราคาที่เลือก -->
      <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
        <h3 style="margin: 0 0 5px 0;">รายการที่เลือก:</h3>
        <p id="displayItem" style="font-weight: bold; color: #2c3e50; font-size: 1.1rem;">กำลังโหลดข้อมูลสินค้า...</p>
      </div>

      <form id="orderForm">
        <div style="margin-bottom: 15px;">
          <label for="customerName" style="display: block; margin-bottom: 5px;">ชื่อ-นามสกุล *</label>
          <input type="text" id="customerName" name="customerName" required placeholder="กรุณากรอกชื่อ-นามสกุล" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 15px;">
          <label for="contact" style="display: block; margin-bottom: 5px;">เบอร์โทรศัพท์ *</label>
          <input type="tel" id="contact" name="contact" required placeholder="กรุณากรอกเบอร์โทรศัพท์" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 15px;">
          <label for="address" style="display: block; margin-bottom: 5px;">ที่อยู่จัดส่ง *</label>
          <textarea id="address" name="address" rows="3" required placeholder="กรุณากรอกที่อยู่จัดส่ง" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
        </div>

        <div style="margin-bottom: 20px;">
          <label for="note" style="display: block; margin-bottom: 5px;">หมายเหตุเพิ่มเติม (ถ้ามี)</label>
          <input type="text" id="note" name="note" placeholder="เช่น ฝากถึงขนส่ง" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; cursor: pointer;">ยืนยันการสั่งซื้อ</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; AURA JEWELRY. Minimalist Sacred Jewelry.</p>
    </div>
  </footer>

  <script>
    // ดึงข้อมูลสินค้าและราคาจาก URL Parameters
    const urlParams = new URLSearchParams(window.location.search);
    const itemName = urlParams.get('item') || 'ไม่ระบุสินค้า';
    const itemPrice = urlParams.get('price') || '0';

    // แสดงชื่อสินค้าและราคาในฟอร์ม
    const displayElement = document.getElementById('displayItem');
    if (displayElement) {
      displayElement.innerText = `${itemName} (฿${Number(itemPrice).toLocaleString()})`;
    }

    // URL ของ Google Apps Script Web App
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAeV1KvF0IOCs9_mkYVWj-bfBeUUg1ZDnvcImRXt-y-ZoX2BAaowQHmt9PK0uBRjSI/exec";

    const orderForm = document.getElementById('orderForm');
    if (orderForm) {
      orderForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.innerText = 'กำลังส่งข้อมูล...';
        }

        // รวบรวมข้อมูลให้อิงตาม ID ในฟอร์ม
        const formData = {
          name: document.getElementById('customerName').value,
          phone: document.getElementById('contact').value,
          item: itemName,
          price: itemPrice,
          address: document.getElementById('address').value,
          note: document.getElementById('note').value || '-'
        };

        // ส่งข้อมูลไปยัง Google Sheets
        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        })
        .then(() => {
          // ส่งเรียบร้อย เปลี่ยนหน้าไป thankyou.html
          window.location.href = 'thankyou.html';
        })
        .catch(error => {
          console.error('Error!', error.message);
          alert('เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerText = 'ยืนยันการสั่งซื้อ';
          }
        });
      });
    }
  </script>
</body>
</html>
