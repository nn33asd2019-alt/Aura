<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า | AURA JEWELRY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-title">AURA JEWELRY</a>
      <nav class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
      </nav>
    </div>
  </header>

  <main class="section-padding">
    <div class="container container-narrow">
      <h1 class="section-title">แบบฟอร์มสั่งซื้อสินค้า</h1>
      <div class="order-form-wrapper">
        <form id="orderForm">
          <div class="form-group">
            <label for="customerName" class="form-label">ชื่อ-นามสกุล *</label>
            <input type="text" id="customerName" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="contact" class="form-label">เบอร์โทรศัพท์ / Line ID *</label>
            <input type="text" id="contact" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="items" class="form-label">รายการสินค้า</label>
            <input type="text" id="items" class="form-control readonly-input" readonly>
          </div>
          <div class="form-group">
            <label for="total" class="form-label">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" class="form-control readonly-input" readonly>
          </div>
          <div class="form-group">
            <label for="note" class="form-label">ที่อยู่จัดส่ง / หมายเหตุ</label>
            <textarea id="note" class="form-control" rows="4"></textarea>
          </div>
          <button type="submit" id="submitBtn" class="btn btn-primary btn-full">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; AURA JEWELRY. Minimalist Sacred Jewelry.</p>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // ดึงค่าสินค้าและราคาจาก URL มาใส่ในฟอร์มอัตโนมัติ
      const urlParams = new URLSearchParams(window.location.search);
      const itemParam = urlParams.get("item");
      const priceParam = urlParams.get("price");

      if (itemParam) {
        document.getElementById("items").value = decodeURIComponent(itemParam);
      }
      if (priceParam) {
        document.getElementById("total").value = priceParam;
      }

      // จัดการการส่งฟอร์มสั่งซื้อไปยัง Google Sheet
      const orderForm = document.getElementById("orderForm");
      if (orderForm) {
        orderForm.addEventListener("submit", function (e) {
          e.preventDefault();

          const submitBtn = document.getElementById("submitBtn");
          submitBtn.disabled = true;
          submitBtn.innerText = "กำลังส่งข้อมูล...";

          const scriptURL = "https://script.google.com/macros/s/AKfycbxAeV1KvF0IOCs9_mkYVWj-bfBeUUg1ZDnvcImRXt-y-ZoX2BAaowQHmt9PK0uBRjSI/exec";

          const formData = {
            customerName: document.getElementById("customerName").value,
            contact: document.getElementById("contact").value,
            items: document.getElementById("items").value,
            total: document.getElementById("total").value,
            note: document.getElementById("note").value
          };

          fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(formData)
          })
          .then(() => {
            window.location.href = "thankyou.html";
          })
          .catch(error => {
            alert("เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง");
            submitBtn.disabled = false;
            submitBtn.innerText = "ยืนยันสั่งซื้อ";
            console.error("Error!", error.message);
          });
        });
      }
    });
  </script>
</body>
</html>
