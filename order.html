<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า | AURA JEWELRY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-title">AURA JEWELRY</a>
      <nav class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
      </nav>
    </div>
  </header>

  <main class="section-padding">
    <div class="container" style="max-width: 600px; margin: 0 auto;">
      <h1 class="section-title" style="text-align: center;">แบบฟอร์มสั่งซื้อสินค้า</h1>
      
      <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; border: 1px solid #e9ecef;">
        <h3 style="margin: 0 0 5px 0;">รายการที่เลือก:</h3>
        <p id="displayItem" style="font-weight: bold; color: #2c3e50; font-size: 1.1rem; margin:0;">กำลังโหลดข้อมูล...</p>
      </div>

      <form id="orderForm">
        <div style="margin-bottom: 15px;">
          <label for="customerName" style="display: block; margin-bottom: 5px; font-weight: bold;">ชื่อ-นามสกุล *</label>
          <input type="text" id="customerName" name="customerName" required placeholder="กรุณากรอกชื่อ-นามสกุล" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
          <label for="contact" style="display: block; margin-bottom: 5px; font-weight: bold;">เบอร์โทรศัพท์ *</label>
          <input type="tel" id="contact" name="contact" required placeholder="กรุณากรอกเบอร์โทรศัพท์" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
          <label for="address" style="display: block; margin-bottom: 5px; font-weight: bold;">ที่อยู่จัดส่ง *</label>
          <textarea id="address" name="address" rows="3" required placeholder="กรุณากรอกที่อยู่จัดส่ง" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"></textarea>
        </div>

        <div style="margin-bottom: 20px;">
          <label for="note" style="display: block; margin-bottom: 5px; font-weight: bold;">หมายเหตุเพิ่มเติม (ถ้ามี)</label>
          <input type="text" id="note" name="note" placeholder="เช่น ฝากถึงขนส่ง" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; cursor: pointer;">ยืนยันการสั่งซื้อ</button>
      </form>
    </div>
  </main>

  <div id="successModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: #fff; padding: 30px; border-radius: 12px; max-width: 400px; width: 85%; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: fadeIn 0.3s ease-in-out;">
      <div style="font-size: 50px; color: #27ae60; margin-bottom: 10px;">✓</div>
      <h2 style="margin-bottom: 10px; color: #2c3e50;">สั่งซื้อสำเร็จ!</h2>
      <p style="color: #666; margin-bottom: 20px; font-size: 0.95rem;">ส่งข้อมูลการสั่งซื้อเรียบร้อยแล้ว!<br>ขอบคุณที่อุดหนุนสินค้า AURA JEWELRY ครับ</p>
      <button onclick="closeModal()" class="btn btn-primary" style="width: 100%; padding: 10px; cursor: pointer; border: none; font-size: 1rem;">ตกลง / กลับหน้าหลัก</button>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; AURA JEWELRY. Minimalist Sacred Jewelry.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      initOrderForm();
    });

    function closeModal() {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
